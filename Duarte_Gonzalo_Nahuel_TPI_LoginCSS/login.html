<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>TP Integrador - CSS - Programacion III</title>
</head>

<body>

    <main class="login__container">

        <form action="" class="login__form">

            <header class="login__header">
                <h1 class="login__title">Food Store</h1>
                <p class="login__sub-title">Iniciar Sesión</p>
            </header>

            <div class="login__fields">
                <label for="email" class="login__label">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="login__input"
                    placeholder="correo@correo.com" 
                    required
                >
            </div>

            <div class="login__fields">
                <label for="password" class="login__label">Contraseña:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="login__input" 
                    placeholder="Minimo 8 caracteres" 
                    required
                >
            </div>

            <button type="submit" class="login__submit">Ingresar</button>

            <div class="login__registrar">
                <p>¿No tenés cuenta? <a href="#" class="login__registrar__link"> Registrate acá</a></p>
            </div>
        </form>
        

    </main>

    <footer>
        <p>&copy; 2026 - Gonzalo Nahuel Duarte</p>
    </footer>
</body>

</html>
